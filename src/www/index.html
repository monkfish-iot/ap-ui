<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运行信息 - AP 管理</title>
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/all.min.css" rel="stylesheet">
<link href="assets/css/wrthub.css" rel="stylesheet">
<style>
/* 主布局：侧栏 + 主内容 + 底栏 */
body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
#app  { flex: 1 1 auto; display: flex; min-height: 0; }
.main { flex: 1 1 auto; overflow-y: auto; padding: 0.9rem; }
</style>
</head>
<body>

<header id="whNavbar"></header>
<div id="app">
    <aside id="whSidebar"></aside>
    <main class="main">

        <!-- Toast 容器 -->
        <div id="toastContainer" class="position-fixed top-0 end-0 p-3" style="z-index:11;"></div>

        <!-- 页面标题 -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0"><i class="fas fa-gauge-high me-1"></i>运行信息</h6>
            <div class="text-muted small" id="pageMuted">-</div>
        </div>

        <!-- 错误提示 -->
        <div id="errBox" class="alert alert-danger small d-none"></div>

        <!-- ① 系统信息 KPI 卡片 -->
        <div class="row g-2 mb-3" id="kpiRow"></div>

        <!-- ①.5 网络接口实时流量（上行口，前端差分采样） -->
        <div class="card shadow-sm mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-chart-line me-1"></i>实时流量（<span id="trafficIface">定位中…</span>）</span>
                <span class="small text-muted" id="chartNote">等待采样…</span>
            </div>
            <div class="card-body p-2">
                <div class="d-flex flex-wrap gap-4 small mb-1">
                    <span><i class="fas fa-arrow-down text-primary me-1"></i>下行 <b id="trDown">-</b></span>
                    <span><i class="fas fa-arrow-up text-success me-1"></i>上行 <b id="trUp">-</b></span>
                    <span class="text-muted ms-auto" id="trTotal">累计 -</span>
                </div>
                <canvas id="trafficChart" style="width:100%;height:180px;"></canvas>
            </div>
        </div>

        <!-- ② 射频状态（每张卡一个子卡片） -->
        <div class="row g-2 mb-3" id="radioRow"></div>

        <!-- ③ 在线终端 -->
        <div class="card shadow-sm mb-3">
            <div class="card-header">
                <span><i class="fas fa-laptop me-1"></i>在线终端</span>
                <span class="badge bg-secondary ms-2" id="clientCountBadge">0</span>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0 small">
                <thead><tr>
                    <th>MAC 地址</th><th>信号</th><th>质量</th><th>速率</th><th>在线时长</th>
                </tr></thead>
                <tbody id="clientTbody"></tbody>
                </table>
                <div id="clientEmpty" class="text-center text-muted small py-3">当前无终端接入</div>
            </div>
        </div>

    </main>
</div>
<footer id="whFooter"></footer>

<!-- 刷新按钮（可选） -->
<div class="position-fixed" style="right:1rem;bottom:3rem;">
    <button id="refreshBtn" class="btn btn-sm btn-outline-primary" title="刷新">
        <i class="fas fa-arrows-rotate"></i>
    </button>
</div>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
    'use strict';

    var el = {
        errBox:   document.getElementById('errBox'),
        kpiRow:   document.getElementById('kpiRow'),
        radioRow: document.getElementById('radioRow'),
        clientTbody: document.getElementById('clientTbody'),
        clientEmpty: document.getElementById('clientEmpty'),
        clientCountBadge: document.getElementById('clientCountBadge'),
        pageMuted: document.getElementById('pageMuted'),
        navHostname: document.getElementById('navHostname'),
        navClients: document.getElementById('navClients'),
        refreshBtn: document.getElementById('refreshBtn')
    };

    function showErr(msg) {
        el.errBox.textContent = msg;
        el.errBox.classList.remove('d-none');
    }

    function fmtBytes(b) {
        if (!b && b !== 0) return '-';
        b = +b;
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
        return (b / 1073741824).toFixed(2) + ' GB';
    }

    /* 内存「已用 / 总量」合并单位，避免两段单位撑爆窄卡片 */
    function fmtMem(free, total) {
        var f = +free, t = +total;
        if (!t) return '-';
        if (t >= 1073741824) return (f / 1073741824).toFixed(1) + ' / ' + Math.round(t / 1073741824) + ' GB';
        return (f / 1048576).toFixed(1) + ' / ' + Math.round(t / 1048576) + ' MB';
    }

    function fmtUptime(sec) {
        sec = +sec || 0;
        var d = Math.floor(sec / 86400);
        sec -= d * 86400;
        var h = Math.floor(sec / 3600);
        sec -= h * 3600;
        var m = Math.floor(sec / 60);
        var s = sec % 60;
        var parts = [];
        if (d) parts.push(d + ' 天');
        if (d || h) parts.push(h + ' 时');
        parts.push(m + ' 分');
        return parts.join(' ') + (d === 0 && h === 0 ? '' : '');
    }

    function fmtRate(bps) {
        if (!bps && bps !== 0) return '-';
        bps = +bps;
        if (bps < 1000) return bps + ' bps';
        if (bps < 1000000) return (bps / 1000).toFixed(1) + ' Kbps';
        return (bps / 1000000).toFixed(1) + ' Mbps';
    }

    /* assoclist 不返回 quality 字段，按 nl80211 惯例由 signal 折算：
     * quality% = 2 × (dBm + 100)，限幅 0..100 */
    function signalToQuality(dbm) {
        if (dbm == null) return null;
        var q = 2 * (+dbm + 100);
        return Math.max(0, Math.min(100, Math.round(q)));
    }

    /* 连接时长（秒）→ 人读文本 */
    function fmtDur(sec) {
        if (sec == null) return '-';
        sec = Math.floor(+sec) || 0;
        if (sec < 60) return sec + ' 秒';
        var d = Math.floor(sec / 86400); sec -= d * 86400;
        var h = Math.floor(sec / 3600); sec -= h * 3600;
        var m = Math.floor(sec / 60), s = sec - m * 60;
        var out = [];
        if (d) out.push(d + ' 天');
        if (d || h) out.push(h + ' 时');
        out.push(m + ' 分');
        if (!d && !h && s) out.push(s + ' 秒');
        return out.join(' ');
    }

    function signalBar(value, max, cssClass) {
        value = +value; max = +max || 1;
        var pct = Math.min(100, Math.max(0, Math.round((value / max) * 100)));
        var color = cssClass || (pct >= 60 ? '#198754' : pct >= 30 ? '#ffc107' : '#dc3545');
        return '<div class="signal-bar"><span style="width:' + pct + '%;background:' + color + ';"></span></div>';
    }

    /* ---------- 实时流量（纯 Canvas，两次采样差分算速率） ---------- */
    var POINTS = 40;
    var hist = { down: [], up: [] };
    var prevTraffic = null;

    function niceMax(v) {
        if (!(v > 0)) return 1;
        var exp = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
        var f = v / exp;
        var n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
        return n * exp;
    }

    function quickRate(mbps) {
        if (mbps === null || mbps === undefined || isNaN(mbps)) return '-';
        if (mbps >= 1000) return (mbps / 1000).toFixed(2) + ' Gbps';
        if (mbps >= 1) return mbps.toFixed(2) + ' Mbps';
        if (mbps >= 0.001) return Math.round(mbps * 1000) + ' Kbps';
        return '0 bps';
    }

    function computeTraffic(tr) {
        tr = tr || {};
        var now = performance.now() / 1000;
        var rx = +tr.rx_bytes || 0, tx = +tr.tx_bytes || 0;
        var curDown = null, curUp = null;
        if (prevTraffic && now > prevTraffic.t) {
            var dt = now - prevTraffic.t;
            curDown = Math.max(0, (rx - prevTraffic.rx) * 8 / dt / 1e6);
            curUp   = Math.max(0, (tx - prevTraffic.tx) * 8 / dt / 1e6);
            hist.down.push(curDown); hist.up.push(curUp);
            while (hist.down.length > POINTS) { hist.down.shift(); hist.up.shift(); }
        }
        prevTraffic = { t: now, rx: rx, tx: tx };

        var dEl = document.getElementById('trDown'), uEl = document.getElementById('trUp');
        if (dEl) dEl.textContent = curDown === null ? '采样中…' : quickRate(curDown);
        if (uEl) uEl.textContent = curUp === null ? '采样中…' : quickRate(curUp);
        var tEl = document.getElementById('trTotal');
        if (tEl) tEl.textContent = '累计 ↓' + fmtBytes(rx) + ' ↑' + fmtBytes(tx);
        var iEl = document.getElementById('trafficIface');
        if (iEl && tr.iface) iEl.textContent = tr.iface;
        var nEl = document.getElementById('chartNote');
        if (nEl) nEl.textContent = '每 5 秒采样 · ' + hist.down.length + ' / ' + POINTS + ' 点';
    }

    function drawTraffic() {
        var canvas = document.getElementById('trafficChart');
        if (!canvas) return;
        var wrap = canvas.parentElement;
        var w = Math.max(320, wrap.clientWidth - 4);
        canvas.width = w; canvas.height = 180;
        var ctx = canvas.getContext('2d');
        var h = canvas.height;
        var padL = 52, padR = 12, padT = 12, padB = 12;
        var plotW = w - padL - padR, plotH = h - padT - padB;
        ctx.clearRect(0, 0, w, h);
        ctx.font = '11px system-ui, sans-serif';
        ctx.textBaseline = 'middle';

        /* 纵轴按窗口内峰值自适应，下限 10 Kbps。
         * 若固定下限 1 Mbps，AP 空闲时的 Kbps 级流量会被压成紧贴 0 的直线（看起来恒为 0）。*/
        var peak = 0;
        for (var i = 0; i < hist.down.length; i++) {
            if (hist.down[i] > peak) peak = hist.down[i];
            if (hist.up[i] > peak) peak = hist.up[i];
        }
        var maxV = niceMax(Math.max(peak * 1.2, 0.01));
        function yLabel(v) {
            if (v === 0) return '0';
            if (maxV >= 1000) return (v / 1000).toFixed(1) + 'G';
            if (maxV >= 1) return (v >= 10 ? Math.round(v) : v.toFixed(1)) + 'M';
            var k = v * 1000;
            return (k >= 10 ? Math.round(k) : k.toFixed(1)) + 'K';
        }

        ctx.strokeStyle = '#e9ecef'; ctx.fillStyle = '#98a2b3'; ctx.lineWidth = 1;
        for (var g = 0; g <= 4; g++) {
            var y = padT + plotH * g / 4;
            ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
            ctx.textAlign = 'right'; ctx.fillText(yLabel(maxV * (4 - g) / 4), padL - 6, y);
        }
        ctx.textAlign = 'left';

        if (hist.down.length < 2) {
            ctx.fillStyle = '#adb5bd'; ctx.textAlign = 'center';
            ctx.fillText('正在采集数据…', padL + plotW / 2, padT + plotH / 2);
            ctx.textAlign = 'left'; return;
        }

        /* 横轴按已有采样点铺满画布：若固定除以 POINTS-1，
         * 采样点少时曲线只会挤在左侧一小段，看起来像没有数据。*/
        function series(data, color, fill) {
            var n = data.length;
            ctx.beginPath();
            for (var i = 0; i < n; i++) {
                var x = padL + plotW * i / (n - 1);
                var yy = padT + plotH - plotH * (data[i] / maxV);
                if (i === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
            }
            ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
            ctx.lineTo(padL + plotW, padT + plotH);
            ctx.lineTo(padL, padT + plotH); ctx.closePath();
            ctx.fillStyle = fill; ctx.fill();
        }
        series(hist.down, '#0d6efd', 'rgba(13,110,253,.10)');
        series(hist.up, '#198754', 'rgba(25,135,84,.08)');
    }

    function renderKPI(sys) {
        var items = [
            { label: '设备型号',  value: sys.model || sys.board || '-',            icon: 'fa-microchip' },
            { label: '主机名',    value: sys.hostname || '-',                       icon: 'fa-server' },
            { label: '固件版本',  value: sys.firmware || '-',                       icon: 'fa-code-branch' },
            { label: '运行时长',  value: fmtUptime(sys.uptime),                    icon: 'fa-clock' },
            { label: '内存',      value: fmtMem(sys.mem_free, sys.mem_total),     icon: 'fa-memory', small: true }
        ];
        el.kpiRow.innerHTML = items.map(function (it) {
            return '<div class="col-6 col-md-3 col-xl">' +
                '<div class="card card-body p-2 shadow-sm text-center">' +
                '<div class="kpi-label"><i class="fas ' + it.icon + ' me-1"></i>' + it.label + '</div>' +
                '<div class="kpi-value mt-1' + (it.small ? ' kpi-value-sm' : ' text-truncate') + '" title="' + Layout.esc(it.value) + '">' + Layout.esc(it.value) + '</div>' +
                '</div></div>';
        }).join('');

        if (el.navHostname) el.navHostname.textContent = sys.hostname || '-';
        if (el.footerInfo)  Layout.setFooterInfo('板型：' + (sys.board || '-'));
    }

    /* 渲染射频卡 —— 数据源是 iwinfo info（直接 ubus call 绕过 mk.*）*/
    function renderRadios(infoList) {
        infoList = infoList || [];
        if (!infoList.length) {
            el.radioRow.innerHTML = '<div class="col-12"><div class="alert alert-secondary small text-center">射频状态加载中…</div></div>';
            return;
        }
        el.radioRow.innerHTML = infoList.map(function (info) {
            var bw = htWidth(info.htmode) || info.htmode || '-';
            var enc = (typeof info.encryption === 'object' && info.encryption.enabled === true) ? 'enabled' : 'none';
            var qBar = signalBar(info.quality_max, info.quality_max || 70);
            return '<div class="col-12 col-md-6">' +
                '<div class="card shadow-sm h-100">' +
                '<div class="card-header d-flex justify-content-between">' +
                '<span><i class="fas fa-wifi me-1"></i>' + Layout.esc(info.ssid || '(未广播)') + '</span>' +
                '<span class="text-muted small">' + Layout.esc(info.phy || '-') + '</span>' +
                '</div>' +
                '<div class="card-body">' +
                '<table class="table table-sm table-borderless mb-0 small">' +
                '<tr><td class="text-muted" style="width:7rem;">工作模式</td><td>' + Layout.esc(info.mode || '-') + '</td></tr>' +
                '<tr><td class="text-muted;">信道</td><td>' + Layout.esc(info.channel || '-') + ' <span class="text-muted small">(' + Layout.esc(bw) + ')</span></td></tr>' +
                '<tr><td class="text-muted;">频段</td><td>' + Layout.esc(info.frequency ? (info.frequency + ' MHz') : '-') + '</td></tr>' +
                '<tr><td class="text-muted;">发射功率</td><td>' + Layout.esc(info.txpower != null ? (info.txpower + ' dBm') : '-') + '</td></tr>' +
                '<tr><td class="text-muted;">噪声</td><td>' + Layout.esc(info.noise != null ? (info.noise + ' dBm') : '-') + '</td></tr>' +
                '<tr><td class="text-muted;">链路质量</td><td>' + qBar + ' <span class="small text-muted">' + Layout.esc((info.quality_max || '-')) + '</span></td></tr>' +
                '<tr><td class="text-muted;">加密</td><td>' + Layout.esc(enc) + '</td></tr>' +
                '</table>' +
                '</div></div></div>';
        }).join('');
    }

    function renderClients(clients) {
        clients = clients || [];
        if (el.clientCountBadge) el.clientCountBadge.textContent = clients.length;
        if (el.navClients)       el.navClients.textContent = clients.length;

        if (!clients.length) {
            if (el.clientEmpty)   el.clientEmpty.classList.remove('d-none');
            if (el.clientTbody)   el.clientTbody.innerHTML = '';
            return;
        }
        if (el.clientEmpty) el.clientEmpty.classList.add('d-none');
        if (el.clientTbody) {
            el.clientTbody.innerHTML = clients.map(function (c) {
                var sigBar = signalBar(c.signal, c.signal_max || 70);
                /* assoclist 真机字段：signal / connected_time / tx.rate（kbit/s）；
                 * 无 quality，故由 signal 折算；速率取 AP→终端方向的 tx.rate */
                var q = signalToQuality(c.signal);
                var rate = (c.tx && c.tx.rate) ? (+c.tx.rate) * 1000 : null;
                return '<tr>' +
                    '<td class="font-monospace small">' + Layout.esc(c.mac || '-') + '</td>' +
                    '<td>' + sigBar + ' <span class="small text-muted">' + Layout.esc(c.signal == null ? '-' : c.signal + ' dBm') + '</span></td>' +
                    '<td>' + Layout.esc(q == null ? '-' : q + '%') + '</td>' +
                    '<td class="small">' + Layout.esc(fmtRate(rate)) + '</td>' +
                    '<td class="small">' + Layout.esc(fmtDur(c.connected_time)) + '</td>' +
                    '</tr>';
            }).join('');
        }
    }

    /* HE20 / HT40 / VHT80 → 20 / 40 / 80（同 ucode 里的 htWidth）*/
    function htWidth(htmode) {
        if (!htmode) return null;
        var m = ('' + htmode).match(/[0-9]+$/);
        return m ? parseInt(m[0]) : null;
    }

    /* 各区块的刷新节奏
     * - overview（KPI + 流量）：5s，流量靠两次计数差分算速率，必须高频
     * - clients（assoclist）：5s，signal / tx.rate / connected_time 都在秒级变化
     * - radios（iwinfo info）：30s，信道 / 噪声 / 速率等变化慢，且调用较重
     * busy.* 防重入：请求慢于间隔时跳过本轮，避免堆积 */
    var busy = { overview: false, radios: false, clients: false };

    /* KPI + 实时流量（供首屏与轮询共用；first=true 时把失败上报到错误框） */
    async function pollOverview(first) {
        if (busy.overview) return;
        busy.overview = true;
        try {
            var d = await API.call('mk.apinfo', 'overview', {});
            renderKPI(d.system || {});
            computeTraffic(d.traffic || {});
            drawTraffic();
            el.pageMuted.textContent = '最后刷新：' + new Date().toLocaleTimeString();
        } catch (e) {
            /* 轮询失败静默，保留上一帧 */
            if (first) {
                showErr('加载失败：' + (e.message || e));
                el.pageMuted.textContent = '';
            }
        }
        busy.overview = false;
    }

    /* 射频状态 —— 直接调 iwinfo info（绕过 mk.*，ucode 内嵌调用会死锁） */
    async function loadRadios() {
        if (busy.radios) return;
        busy.radios = true;
        try {
            var results = await Promise.allSettled([
                API.call('iwinfo', 'info', { device: 'phy0-ap0' }),
                API.call('iwinfo', 'info', { device: 'phy1-ap0' })
            ]);
            var radios = [];
            results.forEach(function (p) { if (p.status === 'fulfilled' && p.value) radios.push(p.value); });
            renderRadios(radios);
        } catch (e) { /* iwinfo 全挂就保持 loading 提示 */ }
        busy.radios = false;
    }

    /* 在线终端 —— iwinfo assoclist，失败时保留上一帧（不空白表格） */
    async function loadClients() {
        if (busy.clients) return;
        busy.clients = true;
        try {
            var aresults = await Promise.allSettled([
                API.call('iwinfo', 'assoclist', { device: 'phy0-ap0' }),
                API.call('iwinfo', 'assoclist', { device: 'phy1-ap0' })
            ]);
            var clients = [];
            aresults.forEach(function (p) {
                if (p.status === 'fulfilled' && typeof p.value === 'object' && Array.isArray(p.value.results))
                    p.value.results.forEach(function (c) { clients.push(c); });
            });
            renderClients(clients);
        } catch (e) { /* 静默，保留上一帧 */ }
        busy.clients = false;
    }

    /* 全量刷新（首屏 / 手动刷新按钮）：三块并行，各自独立成败 */
    async function load() {
        el.errBox.classList.add('d-none');
        el.pageMuted.textContent = '加载中…';
        el.clientCountBadge.textContent = '…';
        el.radioRow.innerHTML = '<div class="col-12"><div class="alert alert-secondary small text-center">射频加载中…</div></div>';
        await Promise.all([ pollOverview(true), loadRadios(), loadClients() ]);
    }

    /* ======== 启动 ======== */
    (async function () {
        if (!(await API.guard())) return;
        await Layout.mount('index.html');
        await load();
        setInterval(function () { pollOverview(false); loadClients(); }, 5000);
        setInterval(loadRadios, 30000);
        window.addEventListener('resize', drawTraffic);
    })();

    el.refreshBtn.addEventListener('click', load);
})();
</script>
</body>
</html>
